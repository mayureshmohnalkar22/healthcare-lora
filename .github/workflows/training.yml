name: Offline LoRA integration
on: workflow_dispatch
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[train]'
      - run: OMP_NUM_THREADS=2 python scripts/test_training.py
