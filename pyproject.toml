[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "healthcare-lora"
version = "0.1.0"
description = "Auditable LoRA experiments for medical literature classification"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = ["scikit-learn==1.7.2", "numpy>=1.26,<3", "fastapi==0.115.12", "uvicorn==0.34.3", "httpx==0.28.1"]
[project.optional-dependencies]
train = ["torch==2.7.1", "transformers==4.52.4", "peft==0.15.2", "trl==0.19.1", "datasets==3.6.0", "accelerate==1.7.0", "mlflow==2.22.0", "SQLAlchemy==2.0.41"]
qlora = ["bitsandbytes==0.46.0; sys_platform == 'linux'"]
dev = ["pytest==8.4.0", "ruff==0.11.13"]
[project.scripts]
healthcare_lora = "healthcare_lora.cli:main"
[tool.setuptools.packages.find]
include = ["healthcare_lora*"]
[tool.setuptools.package-data]
healthcare_lora = ["web/*.html", "web/*.json"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
